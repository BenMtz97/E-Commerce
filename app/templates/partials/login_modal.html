<div x-show="loginModalOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto">
  <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm transition-opacity" @click="closeLoginModal()"></div>
  <div class="flex min-h-full items-center justify-center p-4">
    <div class="relative w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-4 border-b border-slate-800">
        <h3 class="text-base font-bold text-white">Log In to Account</h3>
        <button @click="closeLoginModal()" class="text-slate-400 hover:text-white">&times;</button>
      </div>

      <div class="mt-4 p-3 rounded-lg bg-slate-950/80 border border-slate-800 space-y-2">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 block">Quick Demo Login</span>
        <div class="flex items-center gap-2">
          <button type="button" @click="demoAdminLogin()" class="flex-1 py-1.5 px-2 text-xs font-medium rounded bg-purple-950/60 text-purple-300 border border-purple-500/30 hover:bg-purple-900/60">
            Admin (admin@admin.com)
          </button>
          <button type="button" @click="demoUserLogin()" class="flex-1 py-1.5 px-2 text-xs font-medium rounded bg-emerald-950/60 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-900/60">
            User (user@user.com)
          </button>
        </div>
      </div>

      <div x-html="loginFeedback" class="mt-4"></div>

      <form @submit.prevent="submitLogin()" class="space-y-4 mt-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
          <input type="email" x-model="loginEmail" required placeholder="admin@admin.com or user@user.com"
                 class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
          <input type="password" x-model="loginPassword" required placeholder="admin or user"
                 class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none focus:border-blue-500">
        </div>
        <div class="flex justify-end gap-3 pt-3">
          <button type="button" @click="closeLoginModal()" class="px-4 py-2 text-xs text-slate-300 hover:text-white bg-slate-800 rounded-lg">Cancel</button>
          <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-500 rounded-lg">Log In</button>
        </div>
      </form>
    </div>
  </div>
</div>
