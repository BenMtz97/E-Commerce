<div x-show="editModalOpen"
     x-cloak
     class="fixed inset-0 z-50 overflow-y-auto"
     aria-labelledby="edit-modal-title"
     role="dialog"
     aria-modal="true">

  <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm transition-opacity"
       @click="closeEditModal()"></div>

  <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
    <div class="relative transform overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 p-6 text-left shadow-2xl transition-all w-full max-w-lg mx-4"
         @click.stop>

      <div class="flex items-start justify-between border-b border-slate-800 pb-4 mb-4">
        <div>
          <span class="text-xs uppercase tracking-wider font-semibold text-blue-400">Inventory Catalog</span>
          <h3 class="text-lg font-bold text-white mt-0.5">Edit Product Details</h3>
          <p class="text-xs text-slate-400 font-mono mt-0.5" x-text="editProduct ? 'SKU: ' + editProduct.sku : ''"></p>
        </div>
        <button @click="closeEditModal()"
                class="rounded-lg p-1.5 text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form :action="editProduct ? '/partials/products/' + editProduct.id + '/update' : ''"
            method="post"
            :hx-post="editProduct ? '/partials/products/' + editProduct.id + '/update' : ''"
            :hx-target="editProduct ? '#product-card-' + editProduct.id : ''"
            hx-swap="outerHTML"
            @htmx:after-request="closeEditModal()"
            class="space-y-4">

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Product Name</label>
          <input type="text"
                 name="name"
                 x-model="editProduct.name"
                 required
                 class="block w-full px-3 py-2 text-xs text-white bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-blue-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Category</label>
            <input type="text"
                   name="category"
                   x-model="editProduct.category"
                   required
                   class="block w-full px-3 py-2 text-xs text-white bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Price ($)</label>
            <input type="number"
                   step="0.01"
                   min="0"
                   name="price"
                   x-model="editProduct.price"
                   required
                   class="block w-full px-3 py-2 text-xs text-white font-mono bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Stock Quantity</label>
            <input type="number"
                   min="0"
                   name="stock"
                   x-model="editProduct.stock"
                   required
                   class="block w-full px-3 py-2 text-xs text-white font-mono bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Weight (kg)</label>
            <input type="number"
                   step="0.001"
                   min="0"
                   name="weight_kg"
                   x-model="editProduct.weight_kg"
                   required
                   class="block w-full px-3 py-2 text-xs text-white font-mono bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Description</label>
          <textarea name="description"
                    x-model="editProduct.description"
                    rows="3"
                    class="block w-full px-3 py-2 text-xs text-white bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-blue-500"></textarea>
        </div>

        <div class="pt-3 border-t border-slate-800 flex items-center justify-end gap-3">
          <button type="button"
                  @click="closeEditModal()"
                  class="px-4 py-2 text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
            Cancel
          </button>
          <button type="submit"
                  class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-500 rounded-lg transition-colors shadow-sm shadow-blue-500/20">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
