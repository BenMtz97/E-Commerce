<div x-show="createModalOpen"
     x-cloak
     class="fixed inset-0 z-50 overflow-y-auto"
     aria-labelledby="create-modal-title"
     role="dialog"
     aria-modal="true">

  <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm transition-opacity"
       @click="closeCreateModal()"></div>

  <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
    <div class="relative transform overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 p-6 text-left shadow-2xl transition-all w-full max-w-lg mx-4"
         @click.stop>

      <div class="flex items-start justify-between border-b border-slate-800 pb-4 mb-4">
        <div>
          <span class="text-xs uppercase tracking-wider font-semibold text-blue-400">Inventory Catalog</span>
          <h3 class="text-lg font-bold text-white mt-0.5" id="create-modal-title">Create New Product</h3>
          <p class="text-xs text-slate-400 mt-0.5">Add a new item with security-hardened validation</p>
        </div>
        <button @click="closeCreateModal()"
                type="button"
                class="rounded-lg p-1.5 text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
                aria-label="Close create modal">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div id="create-product-feedback"></div>

      <form id="create-product-form"
            action="/partials/products/create"
            method="post"
            hx-post="/partials/products/create"
            hx-target="#create-product-feedback"
            hx-swap="innerHTML"
            hx-indicator="#create-product-spinner"
            @submit="const fb = document.getElementById('create-product-feedback'); if (fb) fb.innerHTML = '';"
            class="space-y-4">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">SKU <span class="text-rose-400">*</span></label>
            <input type="text"
                   name="sku"
                   placeholder="e.g. KNT-CPU-9900X"
                   required
                   pattern="^[A-Za-z0-9_.\-]+$"
                   title="Alphanumeric, hyphen, underscore, and dot only"
                   class="block w-full px-3 py-2 text-xs text-white uppercase font-mono bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Category <span class="text-rose-400">*</span></label>
            <input type="text"
                   name="category"
                   placeholder="e.g. Computing"
                   required
                   class="block w-full px-3 py-2 text-xs text-white bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Product Name <span class="text-rose-400">*</span></label>
          <input type="text"
                 name="name"
                 placeholder="e.g. Ultra Fast NVMe SSD 2TB"
                 required
                 class="block w-full px-3 py-2 text-xs text-white bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-blue-500">
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Price ($) <span class="text-rose-400">*</span></label>
            <input type="number"
                   step="0.01"
                   min="0"
                   name="price"
                   placeholder="99.99"
                   required
                   class="block w-full px-3 py-2 text-xs text-white font-mono bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Stock <span class="text-rose-400">*</span></label>
            <input type="number"
                   min="0"
                   name="stock"
                   placeholder="10"
                   required
                   class="block w-full px-3 py-2 text-xs text-white font-mono bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Weight (kg) <span class="text-rose-400">*</span></label>
            <input type="number"
                   step="0.001"
                   min="0"
                   name="weight_kg"
                   placeholder="0.500"
                   required
                   class="block w-full px-3 py-2 text-xs text-white font-mono bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Description</label>
          <textarea name="description"
                    rows="3"
                    placeholder="Technical specifications, interface details, and capabilities..."
                    class="block w-full px-3 py-2 text-xs text-white bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-blue-500"></textarea>
        </div>

        <div class="pt-3 border-t border-slate-800 flex items-center justify-end gap-3">
          <button type="button"
                  @click="closeCreateModal()"
                  class="px-4 py-2 text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
            Cancel
          </button>
          <button type="submit"
                  class="inline-flex items-center justify-center gap-2 px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-500 rounded-lg transition-colors shadow-sm shadow-blue-500/20 disabled:opacity-50">
            <svg id="create-product-spinner" class="htmx-indicator animate-spin h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <span>Create Product</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
