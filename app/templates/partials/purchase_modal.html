<div x-show="purchaseModalOpen"
     x-cloak
     class="fixed inset-0 z-50 overflow-y-auto"
     aria-labelledby="modal-title"
     role="dialog"
     aria-modal="true">

  <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm transition-opacity"
       @click="closePurchaseModal()"></div>

  <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
    <div class="relative transform overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 p-6 text-left shadow-2xl transition-all w-full max-w-md mx-4"
         @click.stop>

      <div class="flex items-start justify-between border-b border-slate-800 pb-4 mb-4">
        <div>
          <span class="text-xs uppercase tracking-wider font-semibold text-blue-400">Checkout Authorization</span>
          <h3 class="text-lg font-bold text-white mt-0.5" x-text="selectedProduct ? selectedProduct.name : ''"></h3>
          <p class="text-xs text-slate-400 font-mono mt-0.5" x-text="selectedProduct ? 'SKU: ' + selectedProduct.sku : ''"></p>
        </div>
        <button @click="closePurchaseModal()"
                class="rounded-lg p-1.5 text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div id="purchase-feedback-container" class="mb-4"></div>

      <div x-show="purchaseConfirmed" class="pt-2 flex items-center justify-end">
        <button type="button"
                @click="closePurchaseModal()"
                class="w-full sm:w-auto px-5 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-500 rounded-lg transition-colors shadow-sm shadow-blue-500/20">
          Continue
        </button>
      </div>

      <form x-show="!purchaseConfirmed"
            hx-post="/partials/purchase"
            hx-target="#purchase-feedback-container"
            hx-swap="innerHTML"
            @transaction-confirmed.window="purchaseConfirmed = true"
            @htmx:after-request="if ($event.detail.successful && $event.detail.xhr.status === 200) purchaseConfirmed = true"
            class="space-y-4">

        <input type="hidden" name="product_id" :value="selectedProduct ? selectedProduct.id : ''">

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">
            Purchase Quantity (Available: <span class="font-mono text-emerald-400" x-text="selectedProduct ? selectedProduct.stock : 0"></span>)
          </label>
          <div class="flex items-center rounded-lg border border-slate-700 bg-slate-950 px-3 py-1.5">
            <button type="button"
                    @click="if (purchaseQty > 1) purchaseQty--"
                    class="p-1 text-slate-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed"
                    :disabled="purchaseQty <= 1">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
              </svg>
            </button>
            <input type="number"
                   name="quantity"
                   x-model.number="purchaseQty"
                   min="1"
                   :max="selectedProduct ? selectedProduct.stock : 1"
                   class="w-full text-center bg-transparent border-0 text-white font-mono text-sm focus:ring-0 focus:outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
            <button type="button"
                    @click="if (selectedProduct && purchaseQty < selectedProduct.stock) purchaseQty++"
                    class="p-1 text-slate-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed"
                    :disabled="!selectedProduct || purchaseQty >= selectedProduct.stock">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
              </svg>
            </button>
          </div>
        </div>

        <div class="rounded-lg bg-slate-950/60 border border-slate-800/80 p-3.5 space-y-2">
          <div class="flex justify-between text-xs text-slate-400">
            <span>Unit Price</span>
            <span class="font-mono text-slate-300" x-text="selectedProduct ? '$' + Number(selectedProduct.price).toFixed(2) : '$0.00'"></span>
          </div>
          <div class="flex justify-between text-xs text-slate-400">
            <span>Concurrency Guard</span>
            <span class="font-mono text-blue-400">SELECT FOR UPDATE</span>
          </div>
          <div class="pt-2 border-t border-slate-800 flex justify-between text-sm font-semibold text-white">
            <span>Total Cost</span>
            <span class="font-mono text-emerald-400" x-text="selectedProduct ? '$' + (Number(selectedProduct.price) * purchaseQty).toFixed(2) : '$0.00'"></span>
          </div>
        </div>

        <div class="pt-2 flex items-center justify-end gap-3">
          <button type="button"
                  @click="closePurchaseModal()"
                  class="px-4 py-2 text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
            Cancel
          </button>
          <button type="submit"
                  class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-500 rounded-lg transition-colors shadow-sm shadow-blue-500/20">
            Confirm Transaction
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
