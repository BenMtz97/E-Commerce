<div x-show="csvModalOpen"
     x-cloak
     class="fixed inset-0 z-50 overflow-y-auto"
     aria-labelledby="csv-modal-title"
     role="dialog"
     aria-modal="true">

  <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm transition-opacity"
       @click="closeCsvModal()"></div>

  <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
    <div class="relative transform overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 p-6 text-left shadow-2xl transition-all w-full max-w-lg mx-4"
         @click.stop>

      <div class="flex items-start justify-between border-b border-slate-800 pb-4 mb-4">
        <div>
          <span class="text-xs uppercase tracking-wider font-semibold text-blue-400">Inventory Management</span>
          <h3 class="text-lg font-bold text-white mt-0.5">Import Products via CSV</h3>
          <p class="text-xs text-slate-400 mt-0.5">Upload a CSV file containing hardware catalog items.</p>
        </div>
        <button @click="closeCsvModal()"
                class="rounded-lg p-1.5 text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div id="csv-modal-body">
        <div class="mb-4 rounded-lg bg-slate-950 p-3 border border-slate-800 text-xs text-slate-400 space-y-1">
          <p class="font-medium text-slate-300">Required CSV Columns:</p>
          <p class="font-mono text-slate-400">sku, name, description, category, price, stock, weight_kg</p>
          <div class="pt-1">
            <a href="/sample-csv" class="text-blue-400 hover:text-blue-300 underline font-medium">Download Pre-formatted Sample CSV</a>
          </div>
        </div>

        <form hx-post="/partials/import-csv"
              hx-target="#csv-modal-body"
              hx-swap="innerHTML"
              hx-encoding="multipart/form-data"
              class="space-y-4">

          <div>
            <label class="block text-xs font-medium text-slate-300 mb-2">Select CSV File</label>
            <input type="file"
                   name="file"
                   accept=".csv"
                   required
                   class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700 cursor-pointer">
          </div>

          <div class="pt-2 flex items-center justify-end gap-3">
            <button type="button"
                    @click="closeCsvModal()"
                    class="px-4 py-2 text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
              Cancel
            </button>
            <button type="submit"
                    class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-500 rounded-lg transition-colors shadow-sm shadow-blue-500/20">
              Process CSV Batch
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
