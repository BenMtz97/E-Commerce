{% extends "base.html" %}

{% block title %}E-Commerce App &middot; Products catalog{% endblock %}

{% block content %}
<section class="mb-8">
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 pb-6 border-b border-slate-800">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Products catalog</h1>
    </div>

    <div class="flex items-center gap-3">
      <button @click="openCreateModal()"
              type="button"
              class="inline-flex items-center gap-2 px-3.5 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-500 rounded-lg transition-colors shadow-sm shadow-blue-500/20">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        <span>Create product</span>
      </button>

      <button @click="openCsvModal()"
              type="button"
              class="inline-flex items-center gap-2 px-3.5 py-2 text-xs font-semibold text-slate-200 bg-slate-900 border border-slate-700 hover:border-slate-600 rounded-lg transition-colors">
        <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
        </svg>
        <span>Upload CSV</span>
      </button>

      <a href="/sample-csv"
         class="inline-flex items-center gap-2 px-3.5 py-2 text-xs font-semibold text-slate-300 hover:text-white bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-lg transition-colors">
        <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        <span>Sample CSV</span>
      </a>
    </div>
  </div>

  <div class="mt-6 space-y-3.5">
    <div class="relative w-full">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <input type="text"
             id="main-search-input"
             name="query"
             placeholder="Search by SKU, model name, specification, or category..."
             value="{{ active_query }}"
             hx-get="/partials/products"
             hx-trigger="input changed delay:200ms, search"
             hx-target="#product-grid"
             hx-include="[name='category']"
             class="block w-full pl-11 pr-11 py-3 text-sm text-white placeholder-slate-500 bg-slate-900/90 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all shadow-inner">
      <div class="htmx-indicator absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none">
        <svg class="animate-spin h-5 w-5 text-blue-400" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </div>
    </div>

    <div class="flex items-center justify-between gap-3 pt-1">
      <div class="flex items-center gap-2 overflow-x-auto py-1 scrollbar-thin flex-1 min-w-0">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider shrink-0 pr-1">Category:</span>
        <input type="hidden" name="category" id="active-category-input" value="{{ active_category }}">
        <button type="button"
                onclick="document.getElementById('active-category-input').value='all'; htmx.trigger(document.getElementById('main-search-input'), 'search'); document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('bg-blue-600', 'text-white')); this.classList.add('bg-blue-600', 'text-white');"
                class="cat-btn px-3.5 py-1.5 text-xs font-medium rounded-lg whitespace-nowrap transition-colors shrink-0 {% if active_category == 'all' %}bg-blue-600 text-white{% else %}bg-slate-900 text-slate-300 hover:text-white border border-slate-800/80{% endif %}">
          All Items
        </button>
        {% for cat in categories %}
        <button type="button"
                onclick="document.getElementById('active-category-input').value='{{ cat }}'; htmx.trigger(document.getElementById('main-search-input'), 'search'); document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('bg-blue-600', 'text-white')); this.classList.add('bg-blue-600', 'text-white');"
                class="cat-btn px-3.5 py-1.5 text-xs font-medium rounded-lg whitespace-nowrap transition-colors shrink-0 {% if active_category == cat %}bg-blue-600 text-white{% else %}bg-slate-900 text-slate-300 hover:text-white border border-slate-800/80{% endif %}">
          {{ cat }}
        </button>
        {% endfor %}
      </div>

      <button type="button"
              onclick="document.getElementById('main-search-input').value=''; document.getElementById('active-category-input').value='all'; htmx.trigger(document.getElementById('main-search-input'), 'search'); document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('bg-blue-600', 'text-white')); document.querySelector('.cat-btn').classList.add('bg-blue-600', 'text-white');"
              class="text-xs text-slate-400 hover:text-white shrink-0 px-2.5 py-1 rounded hover:bg-slate-900 transition-colors">
        Clear All
      </button>
    </div>
  </div>
</section>

{% include "partials/product_grid.html" %}
{% endblock %}
